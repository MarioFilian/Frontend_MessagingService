name: 🚀 CI/CD Frontend

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/mensajeria-frontend
  CONTAINER_NAME: mensajeria-frontend
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}
  SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
  ENV_API_GATEWAY: ${{ secrets.ENV_API_GATEWAY }}

jobs:
  build-and-push:
    name: 🐳 Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v3

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🔐 Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: 📦 Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          build-args: |
            VITE_API_GATEWAY=${{ secrets.ENV_API_GATEWAY }}

  deploy-to-ec2:
    name: 🚀 Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 🔐 Connect & Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ env.SSH_KEY }}
          script: |
            # Instalar Docker si no existe
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com -o get-docker.sh
              sudo sh get-docker.sh
              rm get-docker.sh
            fi

            # Detener y eliminar contenedor existente si aplica
            if sudo docker ps -a --format '{{.Names}}' | grep -Eq "^${{ env.CONTAINER_NAME }}$"; then
              sudo docker stop ${{ env.CONTAINER_NAME }}
              sudo docker rm ${{ env.CONTAINER_NAME }}
            fi

            # Descargar imagen y levantar contenedor actualizado
            sudo docker pull ${{ env.IMAGE_NAME }}:latest
            sudo docker run -d --name ${{ env.CONTAINER_NAME }} \
              -e VITE_API_GATEWAY=${{ env.ENV_API_GATEWAY }} \
              -p 80:80 \
              ${{ env.IMAGE_NAME }}:latest
